server {
    listen 443 ssl;
    server_name auth.rohan.run.place;

    ssl_certificate /etc/nginx/ssl/authelia.crt;
    ssl_certificate_key /etc/nginx/ssl/authelia.key;

    # Authelia API / auth endpoint
    location /verify {
        auth_request /authenticate;
        proxy_pass http://authelia:9090/api/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Authelia public API
    location /api {
        proxy_pass http://authelia:9090;
    }

    # Authelia admin UI
    location / {
        proxy_pass http://authelia:9091;
    }
}

server {
    listen 80;
    server_name auth.rohan.run.place;
    return 301 https://$host$request_uri;
}