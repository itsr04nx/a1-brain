services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    networks:
      authelia_default:
        ipv4_address: 172.18.0.10
    expose:
      - "9000"

networks:
  authelia_default:
    external: true
