services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    expose:
      - "9091"
    environment:
      - DATABASE_TYPE=sqlite3
      - SQLITE3_DATABASE=/config/authelia.db
      - JWT_SECRET=change-this-to-a-very-long-random-string
      - COOKIE_SAME_SITE=lax
      - LOG_LEVEL=info
    volumes:
      - ./config:/config
      - ./data:/data
    depends_on:
      - redis
      - lldap

  redis:
    image: redis:7-alpine
    container_name: authelia-redis
    restart: unless-stopped
    command: ["--save", "", "--appendonly", "no"]

  lldap:
    image: nitnelave/lldap:latest
    container_name: lldap
    restart: unless-stopped
    expose:
      - "3890"
      - "17170"
    environment:
      - LLDAP_JWT_SECRET=f4d9a6c2e8b173950184c6e9a2b5d8f1e4a7c0d3b6e9f2a5c8d1e4b7a0c3d6f9
      - LLDAP_KEY_SEED=a1b2c3d4e5f60718293a4b5c6d7e8f90123456789abcdef0123456789abcdef0
      - LLDAP_LDAP_BASE_DN=dc=rohan,dc=run,dc=place
      - LLDAP_LDAP_USER_EMAIL=admin@rohan.run.place
      - LLDAP_LDAP_USER_PASS=admin12345
      - LLDAP_HTTP_URL=https://user.rohan.run.place
    volumes:
      - ./data/lldap:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
    environment:
      - MP_DATA_FILE=/data/mailpit.db
      - MP_SMTP_BIND_ADDR=0.0.0.0:1025
      - MP_UI_BIND_ADDR=0.0.0.0:8025
      - MP_MAX_MESSAGES=5000
    volumes:
      - ./data/mailpit:/data

  mailserver:
    image: mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.rohan.run.place
    restart: unless-stopped
    ports:
      - "993:993"
      - "587:587"
      - "465:465"
    environment:
      - ENABLE_AMAVIS=0
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ENABLE_OPENDKIM=0
      - ENABLE_OPENDMARC=0
      - SPOOF_PROTECTION=0
      - SSL_TYPE=manual
      - SSL_CERT_PATH=/etc/letsencrypt/authelia.crt
      - SSL_KEY_PATH=/etc/letsencrypt/authelia.key
      - OVERRIDE_HOSTNAME=mail.rohan.run.place
      - LOG_LEVEL=warn
      - ACCOUNT_PROVISIONER=LDAP
      - LDAP_SERVER_HOST=ldap://lldap:3890
      - LDAP_SEARCH_BASE=ou=people,dc=rohan,dc=run,dc=place
      - LDAP_BIND_DN=uid=admin,ou=people,dc=rohan,dc=run,dc=place
      - LDAP_BIND_PW=admin12345
      - LDAP_QUERY_FILTER_USER=(&(objectClass=inetOrgPerson)(mail=%s))
      - LDAP_QUERY_FILTER_GROUP=(&(objectClass=groupOfUniqueNames)(uid=%s))
      - LDAP_QUERY_FILTER_ALIAS=(&(objectClass=inetOrgPerson)(mail=%s))
      - LDAP_QUERY_FILTER_DOMAIN=(mail=*@%s)
      - DOVECOT_AUTH_BIND=yes
      - DOVECOT_USER_ATTRS=mail=user,=uid=5000,=gid=5000
      - DOVECOT_PASS_ATTRS=mail=user
      - DOVECOT_USER_FILTER=(&(objectClass=inetOrgPerson)(|(mail=%{user})(uid=%{user})))
      - DOVECOT_PASS_FILTER=(&(objectClass=inetOrgPerson)(|(mail=%{user})(uid=%{user})))
      - ENABLE_QUOTAS=0
    volumes:
      - ./data/dms/mail-data:/var/mail
      - ./data/dms/mail-state:/var/mail-state
      - ./data/dms/mail-logs:/var/log/mail
      - ./data/dms/config:/tmp/docker-mailserver
      - ./nginx/ssl:/etc/letsencrypt:ro
    cap_add:
      - NET_ADMIN
    depends_on:
      - lldap

  snappymail:
    image: djmaze/snappymail:latest
    container_name: snappymail
    restart: unless-stopped
    expose:
      - "8888"
    volumes:
      - ./data/snappymail:/var/lib/snappymail
    depends_on:
      - mailserver

  nginx:
    image: nginx:alpine
    container_name: authelia-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/error-pages:/usr/share/nginx/html/errors:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/mail-autoconfig:/usr/share/nginx/html/autoconfig:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - authelia
      - lldap
      - mailpit
      - mailserver
      - snappymail
