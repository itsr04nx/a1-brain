# NOTE: secrets redacted. Live values: Infra/secrets/homelab-secrets.tar.gz.age
services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    expose:
      - "9091"
    environment:
      - DATABASE_TYPE=sqlite3
      - SQLITE3_DATABASE=/config/authelia.db
      - JWT_SECRET=__REDACTED__
      - COOKIE_SAME_SITE=lax
      - LOG_LEVEL=debug
    volumes:
      - ./config:/config
      - ./data:/data
    networks:
      authelia_default:
        ipv4_address: 172.18.0.2
    depends_on:
      - redis
      - lldap

  redis:
    image: redis:7-alpine
    container_name: authelia-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    networks:
      authelia_default:
        ipv4_address: 172.18.0.5

  lldap:
    image: nitnelave/lldap:latest
    container_name: lldap
    restart: unless-stopped
    ports:
      - "127.0.0.1:3890:3890"
    expose:
      - "3890"
      - "17170"
    environment:
      - LLDAP_JWT_SECRET=__REDACTED__
      - LLDAP_KEY_SEED=__REDACTED__
      - LLDAP_LDAP_BASE_DN=dc=rohan,dc=run,dc=place
      - LLDAP_LDAP_USER_EMAIL=admin@rohan.run.place
      - LLDAP_LDAP_USER_PASS=__REDACTED__
      - LLDAP_HTTP_URL=https://user.rohan.run.place
    volumes:
      - ./data/lldap:/data
    networks:
      authelia_default:
        ipv4_address: 172.18.0.7

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
    environment:
      - MP_DATA_FILE=/data/mailpit.db
      - MP_SMTP_BIND_ADDR=0.0.0.0:1025
      - MP_UI_BIND_ADDR=0.0.0.0:8025
      - MP_MAX_MESSAGES=5000
    volumes:
      - ./data/mailpit:/data
    networks:
      authelia_default:
        ipv4_address: 172.18.0.3

  mailserver:
    image: mailserver/docker-mailserver:17.0.0
    container_name: mailserver
    hostname: mail.rohan.run.place
    restart: unless-stopped
    ports:
      - "25:25"
      - "993:993"
      - "587:587"
      - "465:465"
    environment:
      - POSTMASTER_ADDRESS=admin@rohan.run.place
      - ENABLE_AMAVIS=0
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=1
      - ENABLE_POSTGREY=0
      - ENABLE_OPENDKIM=1
      - ENABLE_OPENDMARC=0
      - SPOOF_PROTECTION=0
      - SSL_TYPE=manual
      - SSL_CERT_PATH=/etc/letsencrypt/authelia.crt
      - SSL_KEY_PATH=/etc/letsencrypt/authelia.key
      - OVERRIDE_HOSTNAME=mail.rohan.run.place
      - LOG_LEVEL=warn
      - ACCOUNT_PROVISIONER=LDAP
      - LDAP_SERVER_HOST=ldap://lldap:3890
      - LDAP_SEARCH_BASE=ou=people,dc=rohan,dc=run,dc=place
      - LDAP_BIND_DN=uid=admin,ou=people,dc=rohan,dc=run,dc=place
      - LDAP_BIND_PW=__REDACTED__
      - POSTFIX_USERS_QUERY_FILTER=(&(objectClass=inetOrgPerson)(mail=%s))
      - POSTFIX_GROUPS_QUERY_FILTER=(&(objectClass=groupOfUniqueNames)(uid=%s))
      - POSTFIX_ALIASES_QUERY_FILTER=(&(objectClass=inetOrgPerson)(mail=%s))
      - POSTFIX_DOMAINS_QUERY_FILTER=(mail=*@%s)
      - DOVECOT_AUTH_BIND=yes
      - DOVECOT_USER_ATTRS=mail=user,=uid=5000,=gid=5000
      - DOVECOT_PASS_ATTRS=mail=user
      - DOVECOT_USER_FILTER=(&(objectClass=inetOrgPerson)(|(mail=%{user})(uid=%{user})))
      - DOVECOT_PASS_FILTER=(&(objectClass=inetOrgPerson)(|(mail=%{user})(uid=%{user})))
      - ENABLE_QUOTAS=0
    volumes:
      - ./data/dms/mail-data:/var/mail
      - ./data/dms/mail-state:/var/mail-state
      - ./data/dms/mail-logs:/var/log/mail
      - ./data/dms/config:/tmp/docker-mailserver
      - ./nginx/ssl:/etc/letsencrypt:ro
    cap_add:
      - NET_ADMIN
    depends_on:
      - lldap
    networks:
      authelia_default:
        ipv4_address: 172.18.0.6

  snappymail:
    image: djmaze/snappymail:latest
    container_name: snappymail
    restart: unless-stopped
    expose:
      - "8888"
    volumes:
      - ./data/snappymail:/var/lib/snappymail
    depends_on:
      - mailserver
    networks:
      authelia_default:
        ipv4_address: 172.18.0.8

  nginx:
    image: nginx:alpine
    container_name: authelia-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/error-pages:/usr/share/nginx/html/errors:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/mail-autoconfig:/usr/share/nginx/html/autoconfig:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/portal:/usr/share/nginx/html/portal:ro
      - /home/ubuntu/Workspace/browser/proot-repo/metadata:/usr/share/nginx/html/myapps-apps:ro
    networks:
      authelia_default:
        ipv4_address: 172.18.0.4
      browser-net:
        ipv4_address: 172.30.0.2
    depends_on:
      - authelia
      - lldap
      - mailpit
      - mailserver
      - snappymail

networks:
  authelia_default:
    external: true
  browser-net:
    external: true
