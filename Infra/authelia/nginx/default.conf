    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^[a-zA-Z0-9_-]+$;

    include /etc/nginx/snippets/internal-only.conf;
    ssl_certificate /etc/nginx/ssl/internal-wildcard.crt;
    ssl_certificate_key /etc/nginx/ssl/internal-wildcard.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    include /etc/nginx/snippets/error-pages.conf;

    location / {
        proxy_pass http://172.30.0.4:8080/resolve-goto?host=$http_host&uri=$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors on;
        error_page 404 =404;
    }
}

# Default HTTPS -> Strict Deny (404) for unmatched hostnames / IP direct access
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/authelia.crt;
    ssl_certificate_key /etc/nginx/ssl/authelia.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    include /etc/nginx/snippets/error-pages.conf;

    return 404;
}

# 1. Authelia Authentication Portal & OIDC Provider
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.rohan.run.place;
    include /etc/nginx/snippets/error-pages.conf;

    ssl_certificate /etc/nginx/ssl/authelia.crt;
    ssl_certificate_key /etc/nginx/ssl/authelia.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Client Certificate / mTLS Authentication (optional)
    ssl_client_certificate /etc/nginx/ssl/client-ca.crt;
    ssl_verify_client optional;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
    proxy_set_header Accept-Encoding "";
    proxy_redirect http:// $scheme://;
    proxy_http_version 1.1;

    location = /portal-user.json {
        auth_request /internal/authelia/authz;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name $upstream_http_remote_name;
        auth_request_set $email $upstream_http_remote_email;
        error_page 401 =200 @portal_guest;

        alias /usr/share/nginx/html/portal/user.template;
        default_type application/json;
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '__USER__' '$user';
        sub_filter '__GROUPS__' '$groups';
        sub_filter '__NAME__' '$name';
        sub_filter '__EMAIL__' '$email';
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location @portal_guest {
        default_type application/json;
        return 200 '{"user":"","name":"","email":"","groups":""}';
    }

    location /internal/authelia/authz {
        internal;
        proxy_intercept_errors off;
        if ($ssl_client_verify = SUCCESS) {
            return 200;
        }
        proxy_pass http://172.30.0.4:8080/internal/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
    }

    location /portal/ {
        alias /usr/share/nginx/html/portal/;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /portal/api/apps {
        proxy_pass http://172.30.0.4:8080/api/gotos;
        proxy_set_header Host $http_host;
    }

    location = /portal-sso-init {
        auth_request /internal/authelia/authz;
        auth_request_set $authelia_session $upstream_http_x_authelia_session;
        if ($authelia_session != "") {
            add_header Set-Cookie "authelia_session=$authelia_session; Domain=rohan.run.place; Path=/; Secure; HttpOnly; SameSite=Lax" always;
        }
        return 204;
    }

    location / {
        auth_request /internal/authelia/authz;
        auth_request_set $authelia_session $upstream_http_x_authelia_session;
        error_page 401 403 = @authelia_direct;

        proxy_pass http://authelia:9091;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie $effective_cookie;
        add_header Set-Cookie $set_authelia_cookie_header always;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:;" always;
        sub_filter_once on;
        sub_filter '</body>' '<link rel="stylesheet" href="/portal/portal.css?v=20261118_03"><script src="/portal/portal.js?v=20261118_03" defer></script></body>';
    }

    location @authelia_direct {
        proxy_pass http://authelia:9091;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:;" always;
        sub_filter_once on;
        sub_filter '</body>' '<link rel="stylesheet" href="/portal/portal.css?v=20261118_03"><script src="/portal/portal.js?v=20261118_03" defer></script></body>';
    }

    location /api/ {
        proxy_pass http://authelia:9091;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie $effective_cookie;
        add_header Set-Cookie $set_authelia_cookie_header always;
    }
}

# 2. LLDAP Interactive User Management UI (user.rohan.run.place & users.rohan.run.place)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name user.rohan.run.place users.rohan.run.place;
    include /etc/nginx/snippets/error-pages.conf;

    ssl_certificate /etc/nginx/ssl/authelia.crt;
    ssl_certificate_key /etc/nginx/ssl/authelia.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_client_certificate /etc/nginx/ssl/client-ca.crt;
    ssl_verify_client optional;

    location /internal/authelia/authz {
        internal;
        proxy_intercept_errors off;
        if ($ssl_client_verify = SUCCESS) {
            return 200;
        }
        proxy_pass http://172.30.0.4:8080/internal/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
    }

    # Static assets directly from LLDAP
    location /static/ {
        proxy_pass http://lldap:17170;
        proxy_set_header Host $http_host;
    }

    location /pkg/ {
        proxy_pass http://lldap:17170;
        proxy_set_header Host $http_host;
    }

    # LLDAP Settings API
    location = /settings {
        proxy_pass http://lldap:17170;
        proxy_set_header Host $http_host;
    }

    # GraphQL API directly to LLDAP
    location /api/ {
        proxy_pass http://lldap:17170;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Token Refresh via SSO Bridge
    location = /auth/refresh {
        auth_request /internal/authelia/authz;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;

        error_page 401 =302 https://auth.rohan.run.place/?rd=$scheme://$http_host$request_uri;
        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/50x.html;

        proxy_pass http://172.18.0.1:17171/auth/refresh;
        proxy_set_header Host $http_host;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_pass_header Set-Cookie;
    }

    # Dedicated SSO Login endpoint
    location = /auth/sso-login {
        auth_request /internal/authelia/authz;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;

        error_page 401 =302 https://auth.rohan.run.place/?rd=$scheme://$http_host$request_uri;
        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/50x.html;

        proxy_pass http://172.18.0.1:17171/auth/sso-login;
        proxy_set_header Host $http_host;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_pass_header Set-Cookie;
    }

    # SSO Logout -> Redirect to Authelia logout
    location = /auth/logout {
        return 302 https://auth.rohan.run.place/logout;
    }

    # Redirect /login directly to SSO bridge
    location = /login {
        auth_request /internal/authelia/authz;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;

        error_page 401 =302 https://auth.rohan.run.place/?rd=$scheme://$http_host$request_uri;
        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/50x.html;

        proxy_pass http://172.18.0.1:17171/login;
        proxy_set_header Host $http_host;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_pass_header Set-Cookie;
    }

    # All UI routes (/, /users, /groups, etc.) served via SSO Bridge with auth cookies
    location / {
        auth_request /internal/authelia/authz;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name $upstream_http_remote_name;
        auth_request_set $email $upstream_http_remote_email;
        auth_request_set $redirection_url $upstream_http_location;

        error_page 401 =302 https://auth.rohan.run.place/?rd=$scheme://$http_host$request_uri;
        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/50x.html;

        proxy_pass http://172.18.0.1:17171;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name $name;
        proxy_set_header Remote-Email $email;
        proxy_pass_header Set-Cookie;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 3. Multi-User Webmail (mail.rohan.run.place & webmail.rohan.run.place)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mail.rohan.run.place webmail.rohan.run.place;
    include /etc/nginx/snippets/error-pages.conf;

    ssl_certificate /etc/nginx/ssl/authelia.crt;
    ssl_certificate_key /etc/nginx/ssl/authelia.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_client_certificate /etc/nginx/ssl/client-ca.crt;
        ssl_verify_client optional;

    # Mozilla Thunderbird Autoconfig & Outlook Autodiscover (Bypasses SSO)
    location ^~ /.well-known/autoconfig/ {
        root /usr/share/nginx/html/autoconfig;
        default_type application/xml;
    }

    location ^~ /mail/config-v1.1.xml {
        root /usr/share/nginx/html/autoconfig;
        default_type application/xml;
    }

    location ^~ /autodiscover/ {
        root /usr/share/nginx/html/autoconfig;
        default_type application/xml;
    }

    location ^~ /.well-known/autodiscover/ {
        root /usr/share/nginx/html/autoconfig;
        default_type application/xml;
    }

    location /internal/authelia/authz {
        internal;
        proxy_intercept_errors off;
        if ($ssl_client_verify = SUCCESS) {
            return 200;
        }
        proxy_pass http://172.30.0.4:8080/internal/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
