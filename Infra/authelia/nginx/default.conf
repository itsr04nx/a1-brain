        }
        proxy_pass http://172.30.0.4:8080/internal/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
    }

    # Sandbox agent-server / VSCode ports (dynamic ephemeral range 32768-60999).
    # The V1 UI talks to each sandbox container directly, so expose it
    # same-origin through this path prefix to avoid mixed-content/CORS issues.
    # NOTE: no auth_request here on purpose. The OpenHands app server itself
    # health-checks these URLs server-side (without an Authelia session) and
    # the agent-server still requires the per-conversation X-Session-API-Key.
    location ~ "^/sandbox/(?<sb_port>3[3-9][0-9]{3}|[4-5][0-9]{4}|60[0-9]{3})(?<sb_path>/.*)$" {
        proxy_pass http://172.17.0.1:$sb_port$sb_path$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /sandbox/$sb_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 100m;
    }

    location ~ "^/sandbox/(?<sb_port>3[3-9][0-9]{3}|[4-5][0-9]{4}|60[0-9]{3})$" {
        # Keep the query string (VS Code's ?folder=...&tkn=... redirect).
        return 302 $uri/$is_args$args;
    }

    location / {
        auth_request /internal/authelia/authz;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name $upstream_http_remote_name;
        auth_request_set $email $upstream_http_remote_email;
        auth_request_set $redirection_url $upstream_http_location;

        client_max_body_size 100m;

        proxy_pass http://100.72.142.64:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name $name;
        proxy_set_header Remote-Email $email;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

