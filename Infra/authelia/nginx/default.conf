    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_client_certificate /etc/nginx/ssl/client-ca.crt;
    ssl_verify_client optional;

    client_max_body_size 500M;

    location /internal/authelia/authz {
        internal;
        proxy_intercept_errors off;
        if ($ssl_client_verify = SUCCESS) {
            return 200;
        }
        proxy_pass http://172.30.0.4:8080/internal/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
    }

    # Portainer SSO Auto-login Bridge
    location = /auth/sso-login {
        auth_request /internal/authelia/authz;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;

        error_page 401 =302 https://auth.rohan.run.place/?rd=$scheme://$http_host$request_uri;
        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/50x.html;

        proxy_pass http://172.18.0.1:17171/portainer/sso-login;
        proxy_set_header Host $http_host;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_pass_header Set-Cookie;
    }

    # Portainer SSO Logout
    location = /auth/logout {
        return 302 http://172.18.0.1:17171/portainer/logout;
    }

    # Websocket connections to Portainer
    location /api/websocket/ {
        auth_request /internal/authelia/authz;
        proxy_pass http://portainer:9000/api/websocket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Allow direct manual authentication to Portainer API without forward-auth block
    location = /api/auth {
        proxy_pass http://portainer:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints (allow direct tokens / cookies)
    location /api/ {
        auth_request /internal/authelia/authz;
        proxy_pass http://portainer:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static assets directly from Portainer
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|map)$ {
        proxy_pass http://portainer:9000;
        proxy_set_header Host $http_host;
    }

    # UI Pages & Root: Check if portainer_api_key cookie exists; if not, bounce to SSO login
    location / {
        auth_request /internal/authelia/authz;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name $upstream_http_remote_name;
        auth_request_set $email $upstream_http_remote_email;
        auth_request_set $authelia_session $upstream_http_x_authelia_session;
        auth_request_set $redirection_url $upstream_http_location;

        add_header Set-Cookie $set_authelia_cookie_header always;

        error_page 401 =302 https://auth.rohan.run.place/?rd=$scheme://$http_host$request_uri;
        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/50x.html;

        if ($cookie_portainer_api_key = "") {
            return 302 /auth/sso-login?rd=$request_uri;
        }

        proxy_pass http://portainer:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}


