    default "";
}

client_max_body_size 100M;
resolver 127.0.0.11 valid=10s ipv6=off;


# Dedicated In-House DNS & Gotos UI / Resolver (HTTP 80) - Internal Only
server {
    listen 80;
    listen [::]:80;
    server_name goto go goto.rohan.run.place internal internal.rohan.run.place;
    include /etc/nginx/snippets/internal-only.conf;

    location = / {
        proxy_pass http://172.30.0.4:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /resolve-goto {
        proxy_pass http://172.30.0.4:8080/resolve-goto$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /portal {
        proxy_pass http://172.30.0.4:8080/portal;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /gotos {
        proxy_pass http://172.30.0.4:8080/gotos;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://172.30.0.4:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://172.30.0.4:8080/resolve-goto?host=$http_host&uri=$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

