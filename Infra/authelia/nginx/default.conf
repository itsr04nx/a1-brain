# Default HTTP -> In-House Gotos & DNS Resolver with HTTPS Redirect fallback
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://172.30.0.4:8080/resolve-goto?host=$http_host&uri=$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors on;
        error_page 404 = @default_https_redirect;
    }

    location @default_https_redirect {
        return 301 https://$host$request_uri;
    }
}

# In-House Gotos & Short-Names HTTPS Router
