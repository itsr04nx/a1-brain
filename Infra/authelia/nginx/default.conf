server {
    listen 80;
    listen [::]:80;
    server_name firewall.rohan.run.place;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name firewall.rohan.run.place;
    include /etc/nginx/snippets/error-pages.conf;

    ssl_certificate /etc/nginx/ssl/firewall.crt;
    ssl_certificate_key /etc/nginx/ssl/firewall.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_client_certificate /etc/nginx/ssl/client-ca.crt;
    ssl_verify_client optional;

    client_max_body_size 50M;

    location /internal/authelia/authz {
        internal;
        proxy_intercept_errors off;
        if ($ssl_client_verify = SUCCESS) {
            return 200;
        }
        proxy_pass http://172.30.0.4:8080/internal/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
    }

    # AdGuard Firewall SSO Auto-login Bridge
    location = /auth/sso-login {
        auth_request /internal/authelia/authz;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;

        error_page 401 =302 https://auth.rohan.run.place/?rd=$scheme://$http_host$request_uri;
        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/50x.html;

        proxy_pass http://172.18.0.1:17171/firewall/sso-login;
        proxy_set_header Host $http_host;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_pass_header Set-Cookie;
    }

    # AdGuard Firewall Logout
    location = /auth/logout {
        return 302 http://172.18.0.1:17171/firewall/logout;
    }

    # Static assets directly from AdGuard Home
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|map)$ {
        proxy_pass http://172.30.0.5:3000;
        proxy_set_header Host $http_host;
    }

    location / {
        auth_request /internal/authelia/authz;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;

        error_page 401 =302 https://auth.rohan.run.place/?rd=$scheme://$http_host$request_uri;
        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/50x.html;

        if ($cookie_agh_session = "") {
            return 302 /auth/sso-login?rd=$request_uri;
        }

        proxy_pass http://172.30.0.5:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# System Status Indicator & Homelab Health (HTTP 80)
server {
    listen 80;
    listen [::]:80;
    server_name status status.rohan.run.place;

    location / {
        return 301 https://$host$request_uri;
    }
}

# System Status Indicator & Homelab Health (HTTPS 443) - Uptime Kuma (Incident.io / Cloudflare style)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name status status.rohan.run.place;

    ssl_certificate /etc/nginx/ssl/status.crt;
    ssl_certificate_key /etc/nginx/ssl/status.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    include /etc/nginx/snippets/error-pages.conf;

    location / {
        proxy_pass http://172.30.0.6:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 14. Paperclip Agent Orchestrator & Multi-Agent Operations (paperclip.rohan.run.place)
server {
    listen 80;
    listen [::]:80;
    server_name paperclip paperclip.rohan.run.place;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name paperclip paperclip.rohan.run.place;
    include /etc/nginx/snippets/error-pages.conf;

    ssl_certificate /etc/nginx/ssl/paperclip.crt;
    ssl_certificate_key /etc/nginx/ssl/paperclip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /internal/authelia/authz {
        internal;
        proxy_intercept_errors off;
        proxy_pass http://172.30.0.4:8080/internal/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
    }

    # Public Health check for Uptime Kuma and service monitors
    location = /api/health {
        proxy_pass http://172.30.0.7:3100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web UI, API & WebSocket live events (SSO Gated)
    location / {
        auth_request /internal/authelia/authz;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name $upstream_http_remote_name;
        auth_request_set $email $upstream_http_remote_email;
        auth_request_set $redirection_url $upstream_http_location;

        error_page 401 =302 $redirection_url;

        proxy_pass http://172.30.0.7:3100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name $name;
        proxy_set_header Remote-Email $email;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
