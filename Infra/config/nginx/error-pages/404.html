<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Rohan Homelab</title>
    <style>
        :root {
            --bg-base: #0a0e17;
            --bg-card: rgba(17, 24, 39, 0.94);
            --border-card: rgba(255, 255, 255, 0.08);
            --accent-purple: #8b5cf6;
            --accent-purple-glow: rgba(139, 92, 246, 0.15);
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --text-muted: #6b7280;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.12), transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.08), transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            width: 100%;
            max-width: 540px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 2.25rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            text-align: center;
        }
        .icon-wrap {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--accent-purple-glow);
            border: 1px solid rgba(139, 92, 246, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
        }
        .icon-wrap svg {
            width: 32px;
            height: 32px;
            color: var(--accent-purple);
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: var(--accent-purple-glow);
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #d8b4fe;
            margin-bottom: 1rem;
        }
        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #a855f7;
            box-shadow: 0 0 8px #a855f7;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 0.95rem;
            color: var(--text-sub);
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
        .path-pill {
            display: inline-block;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 2px 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.85rem;
            color: #d8b4fe;
            word-break: break-all;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-hover));
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #60a5fa, var(--accent-blue));
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.45);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        .footer {
            border-top: 1px solid var(--border-card);
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .footer a {
            color: #93c5fd;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .copy-link {
            cursor: pointer;
            color: var(--text-sub);
            border: none;
            background: none;
            font-size: 0.75rem;
            text-decoration: underline;
        }
        .copy-link:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrap">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
        </div>

        <div>
            <span class="badge">
                <span class="badge-dot"></span>
                404 &bull; Resource Not Found
            </span>
        </div>

        <h1>Page Not Found</h1>
        <p class="subtitle">
            The requested path <span class="path-pill" id="target-path">/</span> does not exist or has been relocated on <span class="path-pill" id="target-app">this service</span>.
        </p>

        <div class="actions">
            <a class="btn btn-primary" href="/">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Return to Service Home
            </a>
            <a class="btn btn-secondary" href="https://auth.rohan.run.place/">
                Homelab Portal Home
            </a>
            <a class="btn btn-secondary" href="https://cockpit.rohan.run.place/">
                Host Management (Cockpit)
            </a>
        </div>

        <div class="footer">
            <span>Support: <a href="mailto:admin@rohan.run.place?subject=404%20Page%20Not%20Found">admin@rohan.run.place</a></span>
            <button class="copy-link" onclick="copyDiagnostics()">Copy Diagnostics</button>
        </div>
    </div>

    <script>
        const appMap = {
            'auth.rohan.run.place': 'Authelia SSO Portal',
            'user.rohan.run.place': 'LLDAP Directory Portal',
            'users.rohan.run.place': 'LLDAP Directory Portal',
            'mail.rohan.run.place': 'SnappyMail Webmail',
            'webmail.rohan.run.place': 'SnappyMail Webmail',
            'mailpit.rohan.run.place': 'Mailpit Test Inbox',
            'openhands.rohan.run.place': 'OpenHands AI Workspace',
            'opencode.rohan.run.place': 'OpenCode IDE Workspace',
            'cockpit.rohan.run.place': 'Cockpit Host Console'
        };

        const currentHost = window.location.hostname;
        const currentPath = window.location.pathname;
        const currentUrl = window.location.href;
        const friendlyName = appMap[currentHost] || currentHost;

        document.getElementById('target-app').innerText = friendlyName;
        document.getElementById('target-path').innerText = currentPath || '/';

        function copyDiagnostics() {
            const diag = {
                timestamp: new Date().toISOString(),
                status: 404,
                error: 'Page Not Found',
                application: friendlyName,
                host: currentHost,
                path: currentPath,
                url: currentUrl,
                userAgent: navigator.userAgent
            };
            navigator.clipboard.writeText(JSON.stringify(diag, null, 2)).then(() => {
                alert('Diagnostic info copied to clipboard!');
            }).catch(() => {
                prompt('Copy diagnostic details:', JSON.stringify(diag));
            });
        }
    </script>
</body>
</html>
