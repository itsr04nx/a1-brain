client_max_body_size 100M;

# Default HTTP -> Redirect to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Default HTTPS -> Strict Deny (404) for unmatched hostnames / IP direct access
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/authelia.crt;
    ssl_certificate_key /etc/nginx/ssl/authelia.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    include /etc/nginx/snippets/error-pages.conf;

    return 404;
}

# 1. Authelia Authentication Portal & OIDC Provider
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.rohan.run.place;
    include /etc/nginx/snippets/error-pages.conf;

    ssl_certificate /etc/nginx/ssl/authelia.crt;
    ssl_certificate_key /etc/nginx/ssl/authelia.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Client Certificate / mTLS Authentication (optional)
    ssl_client_certificate /etc/nginx/ssl/client-ca.crt;
    ssl_verify_client optional;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
    proxy_redirect http:// $scheme://;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://authelia:9091;
    }

    location /api/verify {
        proxy_pass http://authelia:9091;
    }

    location /api/authz/ {
        proxy_pass http://authelia:9091;
    }
}

# 2. LLDAP Interactive User Management UI (user.rohan.run.place & users.rohan.run.place)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name user.rohan.run.place users.rohan.run.place;
    include /etc/nginx/snippets/error-pages.conf;

    ssl_certificate /etc/nginx/ssl/authelia.crt;
    ssl_certificate_key /etc/nginx/ssl/authelia.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_client_certificate /etc/nginx/ssl/client-ca.crt;
    ssl_verify_client optional;

    location /internal/authelia/authz {
        internal;
        if ($ssl_client_verify = SUCCESS) {
            return 200;
        }
        proxy_pass http://authelia:9091/api/authz/auth-request;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        auth_request /internal/authelia/authz;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name $upstream_http_remote_name;
        auth_request_set $email $upstream_http_remote_email;
        auth_request_set $redirection_url $upstream_http_location;


        proxy_pass http://lldap:17170;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name $name;
        proxy_set_header Remote-Email $email;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 3. Multi-User Webmail (mail.rohan.run.place & webmail.rohan.run.place)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mail.rohan.run.place webmail.rohan.run.place;
    include /etc/nginx/snippets/error-pages.conf;

