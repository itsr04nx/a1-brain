    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_client_certificate /etc/nginx/ssl/client-ca.crt;
        ssl_verify_client optional;

    # Mozilla Thunderbird Autoconfig & Outlook Autodiscover (Bypasses SSO)
    location ^~ /.well-known/autoconfig/ {
        root /usr/share/nginx/html/autoconfig;
        default_type application/xml;
    }

    location ^~ /mail/config-v1.1.xml {
        root /usr/share/nginx/html/autoconfig;
        default_type application/xml;
    }

    location ^~ /autodiscover/ {
        root /usr/share/nginx/html/autoconfig;
        default_type application/xml;
    }

    location ^~ /.well-known/autodiscover/ {
        root /usr/share/nginx/html/autoconfig;
        default_type application/xml;
    }

    location /internal/authelia/authz {
