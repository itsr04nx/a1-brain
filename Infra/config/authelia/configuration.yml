theme: dark

session:
  cookies:
    - name: authelia_session
      domain: rohan.run.place
      authelia_url: https://auth.rohan.run.place
      inactivity: 12h
      expiration: 7d
      remember_me: 30d

storage:
  local:
    path: /config/authelia.db
  encryption_key: change-this-to-a-very-long-random-encryption-key-min-64-characters-long-please

authentication_backend:
  ldap:
    implementation: "custom"
    address: "ldap://lldap:3890"
    base_dn: "dc=rohan,dc=run,dc=place"
    user: "uid=admin,ou=people,dc=rohan,dc=run,dc=place"
    password: "admin12345"
    additional_users_dn: "ou=people"
    users_filter: "(&({username_attribute}={input})(|(objectClass=person)(objectClass=inetOrgPerson)))"
    additional_groups_dn: "ou=groups"
    groups_filter: "(|(member={dn})(uniqueMember={dn}))"
    attributes:
      username: "uid"
      display_name: "displayName"
      mail: "mail"
      group_name: "app-access"

identity_validation:
  reset_password:
    jwt_secret: change-this-to-a-very-long-random-secret-for-jwt-reset

access_control:
  default_policy: deny
  rules:
    - domain: auth.rohan.run.place
      policy: bypass

    - domain:
        - user.rohan.run.place
        - users.rohan.run.place
      policy: one_factor
      subject:
        - "group:user-admin"
        - "group:admin"
        - "group:all"

    - domain: mailpit.rohan.run.place
      policy: one_factor
      subject:
        - "group:mailpit"
        - "group:admin"
        - "group:all"

    - domain: cockpit.rohan.run.place
      policy: one_factor
      subject:
        - "group:cockpit"
        - "group:admin"
        - "group:all"

    - domain: openhands.rohan.run.place
      policy: one_factor
      subject:
        - "group:openhands"
        - "group:admin"
        - "group:all"

    - domain: opencode.rohan.run.place
      policy: one_factor
      subject:
        - "group:opencode"
        - "group:admin"
        - "group:all"

    - domain:
        - mail.rohan.run.place
        - webmail.rohan.run.place
      policy: one_factor
      subject:
        - "group:mail"
        - "group:admin"
        - "group:all"

