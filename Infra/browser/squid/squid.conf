http_port 3128
visible_hostname browser-squid
shutdown_lifetime 1 seconds

acl browser_net src 172.30.0.0/24
acl SSL_ports port 443 8443
acl Safe_ports port 80 443 8080 8443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

include /etc/squid/users/*.conf

http_access deny all
cache deny all

logformat browser %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %Sh/%<A %mt
cache_log stdio:/var/log/squid/cache.log
access_log stdio:/var/log/squid/access.log browser
coredump_dir /var/spool/squid
dns_nameservers 1.1.1.1 9.9.9.9
httpd_suppress_version_string on
