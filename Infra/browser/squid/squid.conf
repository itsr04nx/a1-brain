http_port 3128
visible_hostname browser-squid
shutdown_lifetime 1 seconds

error_directory /etc/squid/errors

acl browser_net src 172.30.0.0/24
# Admin bandwidth ACL is generated from the live username -> IP map so a
# recycled address cannot inherit another user's unlimited pool.
acl admin_users src "/etc/squid/users/admin_ips.txt"
acl SSL_ports port 443 8443
acl Safe_ports port 80 443 8080 8443 1025-65535
acl CONNECT method CONNECT

# Morgan Stanley / Regulated Financial Firm Compliance Blocklists
acl blocked_adult dstdomain "/etc/squid/categories/adult.txt"
acl blocked_gambling dstdomain "/etc/squid/categories/gambling.txt"
acl blocked_gaming dstdomain "/etc/squid/categories/gaming.txt"
acl blocked_dating dstdomain "/etc/squid/categories/dating.txt"
acl blocked_p2p dstdomain "/etc/squid/categories/p2p_torrents.txt"
acl blocked_crypto dstdomain "/etc/squid/categories/crypto_mining.txt"
acl blocked_weapons dstdomain "/etc/squid/categories/weapons_violence.txt"
acl blocked_domains dstdomain "/etc/squid/blocked_domains.txt"
acl adult_exempt src "/etc/squid/users/adult_exempt_ips.txt"

# Corporate Block Page Template
deny_info ERR_CORPORATE_BLOCKED blocked_adult
deny_info ERR_CORPORATE_BLOCKED blocked_gambling
deny_info ERR_CORPORATE_BLOCKED blocked_gaming
deny_info ERR_CORPORATE_BLOCKED blocked_dating
deny_info ERR_CORPORATE_BLOCKED blocked_p2p
deny_info ERR_CORPORATE_BLOCKED blocked_crypto
deny_info ERR_CORPORATE_BLOCKED blocked_weapons
deny_info ERR_CORPORATE_BLOCKED blocked_domains

# Enforce Blocking
http_access deny blocked_adult !adult_exempt
http_access deny blocked_gambling
http_access deny blocked_gaming
http_access deny blocked_dating
http_access deny blocked_p2p
http_access deny blocked_crypto
http_access deny blocked_weapons
http_access deny blocked_domains

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

include /etc/squid/users/*.conf

http_access allow browser_net
http_access deny all
cache deny all

# Bandwidth Throttling / Delay Pools
delay_pools 2

delay_class 1 1
delay_parameters 1 -1/-1
delay_access 1 allow admin_users
delay_access 1 deny all

delay_class 2 2
delay_parameters 2 10485760/20971520 2097152/4194304
delay_access 2 allow browser_net
delay_access 2 deny all

logformat browser %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %Sh/%<A %mt
cache_log stdio:/var/log/squid/cache.log
access_log stdio:/var/log/squid/access.log browser
coredump_dir /var/spool/squid
dns_nameservers 172.30.0.5 1.1.1.1
httpd_suppress_version_string on
