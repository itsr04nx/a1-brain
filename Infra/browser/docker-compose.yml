services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      NETWORKS: 1
      VOLUMES: 1
      IMAGES: 1
      EXEC: 1
      INFO: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      control-net:
        ipv4_address: 172.33.0.2

  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    volumes:
      - /home/ubuntu/Workspace/browser/adguard/conf:/opt/adguardhome/conf
      - /home/ubuntu/Workspace/browser/adguard/work:/opt/adguardhome/work
    networks:
      browser-net:
        ipv4_address: 172.30.0.5
      egress-net:
        ipv4_address: 172.32.0.2

  squid:
    image: ubuntu/squid:latest
    container_name: squid
    restart: unless-stopped
    volumes:
      - /home/ubuntu/Workspace/browser/squid/squid.conf:/etc/squid/squid.conf:ro
      - /home/ubuntu/Workspace/browser/squid/blocked_domains.txt:/etc/squid/blocked_domains.txt:ro
      - /home/ubuntu/Workspace/browser/squid/users:/etc/squid/users:ro
      - /home/ubuntu/Workspace/browser/squid/logs:/var/log/squid
      - /home/ubuntu/Workspace/browser/squid/cache:/var/spool/squid
    networks:
      browser-net:
        ipv4_address: 172.30.0.3
      egress-net:
        ipv4_address: 172.32.0.3
    depends_on:
      - adguard

  browser-gateway:
    build: ./gateway
    container_name: browser-gateway
    restart: unless-stopped
    environment:
      AUTHELIA_URL: http://authelia:9091
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      MAX_SESSIONS: "3"
      FF_IMAGE: lscr.io/linuxserver/firefox:latest
      NGINX_IP: "172.30.0.2"
      GATEWAY_IP: "172.30.0.4"
      PROFILES_DIR: /home/ubuntu/Workspace/browser/profiles
      SQUID_USERS_DIR: /home/ubuntu/Workspace/browser/squid/users
      SQUID_BLOCKED_DOMAINS: /squid_blocked_domains.txt
      DB_PATH: /data/gateway.db
      IDLE_MINUTES: "20"
      ALLOWED_GROUPS: "admins,apps-all,ai-dev-core,browser"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TZ: Asia/Kolkata
    volumes:
      - /home/ubuntu/Workspace/browser/profiles:/home/ubuntu/Workspace/browser/profiles
      - /home/ubuntu/Workspace/browser/squid/users:/home/ubuntu/Workspace/browser/squid/users
      - /home/ubuntu/Workspace/browser/squid/blocked_domains.txt:/squid_blocked_domains.txt
      - /home/ubuntu/Workspace/browser/data:/data
      - /home/ubuntu/Workspace/browser/gateway/app.py:/app/app.py
      - /home/ubuntu/Workspace/authelia/data/lldap:/lldap_data:rw
    networks:
      control-net:
        ipv4_address: 172.33.0.3
      browser-net:
        ipv4_address: 172.30.0.4
      authelia_default:
        ipv4_address: 172.18.0.9
    depends_on:
      - docker-socket-proxy
      - adguard
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  control-net:
    external: true
  browser-net:
    external: true
  browser-internal:
    external: true
  authelia_default:
    external: true
  egress-net:
    external: true
