# Netdata - cluster metrics for the Rohan Run Place Always Free host
# Kept small on purpose: 2 OCPU / 12 GB host already runs near capacity.
[global]
    hostname = rohan-cluster
    host access prefix = /host
    update every = 2
    run as user = netdata

[db]
    mode = dbengine
    storage tiers = 1
    dbengine multihost disk space MB = 512
    page cache size MB = 32

[ml]
    enabled = no

[web]
    bind to = 0.0.0.0:19999
    allow connections from = *
    allow dashboard from = *
